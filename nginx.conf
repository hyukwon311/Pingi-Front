server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── 프록시 공통 설정 ──────────────────────────────────────────
    client_max_body_size 10m;
    proxy_read_timeout 120s;
    proxy_connect_timeout 15s;
    proxy_send_timeout 120s;

    # ── gzip 압축 ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;

    # 압축 대상 MIME 타입. JS·CSS·JSON 등 텍스트 기반 자산만 포함한다.
    # (image/png 같은 이미 압축된 바이너리는 효과 없으므로 제외)
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── 백엔드 API 리버스 프록시 ──────────────────────────────────
    # /v1/ 로 시작하는 요청을 같은 Docker 네트워크(pingi_net)의
    # pingi-backend 컨테이너로 전달한다.
    # 브라우저 입장에서 동일 출처(same-origin)가 되므로 CORS 설정이 불필요하다.
    location /v1/ {
        proxy_pass http://pingi-backend:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.io WebSocket 업그레이드 지원
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Vite 빌드 정적 자산 캐싱 ─────────────────────────────────
    # /assets/ 하위 파일은 Vite 가 콘텐츠 해시를 파일명에 포함시킨다.
    # (예: index-B3s1se0q.js) 소스가 바뀌면 해시도 바뀌므로
    # 브라우저가 1 년간 캐시해도 절대 낡은 파일을 쓰지 않는다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # 파일이 실제로 존재할 때만 서빙하고, 없으면 404 를 반환한다.
        try_files $uri =404;
    }

    # ── index.html 캐시 방지 ─────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── SPA 클라이언트 사이드 라우팅 ─────────────────────────────
    # React Router 등이 처리하는 경로(예: /session/123)는
    # 서버에 실제 파일이 없으므로 index.html 로 폴백시켜
    # 클라이언트 JS 가 라우팅을 처리하도록 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
